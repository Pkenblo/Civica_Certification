models:
  - name: slv_google_sheets__budget
    description: Model for google sheet budget sin repetidos ni nulos relationship y acepted range
    columns:
      - name: budget_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sql_server_dbo__products')
                field: product_id
      - name: quantity_budgeted
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: budget_month
      - name: date_load